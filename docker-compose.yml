# Ambiente local / servidor único. Em produção prefira PostgreSQL gerenciado com PITR.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: eskimo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eskimo_dev}
      POSTGRES_DB: eskimo
      TZ: America/Sao_Paulo
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eskimo"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://eskimo:${POSTGRES_PASSWORD:-eskimo_dev}@db:5432/eskimo
      WEB_DIST_DIR: /app/web
    ports:
      - "3333:3333"

volumes:
  pgdata:
